<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Dark navy background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B1825;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D1B2A;stop-opacity:1" />
    </linearGradient>

    <!-- Gold shimmer for rule lines -->
    <linearGradient id="goldH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#B8965A;stop-opacity:0" />
      <stop offset="30%" style="stop-color:#D4B483;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#B8965A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8965A;stop-opacity:0" />
    </linearGradient>

    <!-- Subtle parchment noise filter -->
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="gray"/>
      <feBlend in="SourceGraphic" in2="gray" mode="overlay" result="blended"/>
      <feComposite in="blended" in2="SourceGraphic" operator="in"/>
    </filter>

    <!-- Soft vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:0" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.55" />
    </radialGradient>

    <!-- Decorative arc for Chi Rho feel -->
    <clipPath id="bounds">
      <rect width="1200" height="630"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grain overlay -->
  <rect width="1200" height="630" fill="url(#bg)" filter="url(#grain)" opacity="0.08"/>

  <!-- ── Decorative manuscript marks (background layer) ── -->

  <!-- Large faint circle — ancient seal motif -->
  <circle cx="960" cy="315" r="240" fill="none" stroke="#B8965A" stroke-width="0.6" opacity="0.12"/>
  <circle cx="960" cy="315" r="220" fill="none" stroke="#D4B483" stroke-width="0.3" opacity="0.08"/>

  <!-- Chi Rho ghost glyph (☧) rendered as overlapping lines -->
  <g transform="translate(960,315)" opacity="0.07" stroke="#D4B483" stroke-width="1.5" fill="none">
    <line x1="-60" y1="-80" x2="60" y2="80"/>
    <line x1="60" y1="-80" x2="-60" y2="80"/>
    <path d="M0,-80 C40,-80 60,-50 60,-20 C60,10 40,30 0,30" stroke-width="2"/>
    <line x1="-20" y1="10" x2="60" y2="10"/>
  </g>

  <!-- Small faint Hebrew aleph (𐤀) approximation — angular mark -->
  <g transform="translate(120,520)" opacity="0.08" stroke="#B8965A" stroke-width="1.2" fill="none">
    <line x1="0" y1="0" x2="30" y2="-50"/>
    <line x1="30" y1="-50" x2="60" y2="0"/>
    <line x1="10" y1="-25" x2="50" y2="-25"/>
  </g>

  <!-- Cuneiform wedge cluster (top right) -->
  <g transform="translate(1080,80)" opacity="0.07" fill="#D4B483">
    <polygon points="0,0 4,10 0,8"/>
    <polygon points="10,0 14,10 10,8"/>
    <polygon points="20,0 24,10 20,8"/>
    <polygon points="5,14 9,24 5,22"/>
    <polygon points="15,14 19,24 15,22"/>
  </g>

  <!-- ── Horizontal rule system ── -->
  <rect x="80" y="90" width="1040" height="0.6" fill="url(#goldH)" opacity="0.5"/>
  <rect x="80" y="540" width="1040" height="0.6" fill="url(#goldH)" opacity="0.5"/>

  <!-- Thin inner rules -->
  <rect x="80" y="96" width="1040" height="0.3" fill="url(#goldH)" opacity="0.2"/>
  <rect x="80" y="534" width="1040" height="0.3" fill="url(#goldH)" opacity="0.2"/>

  <!-- ── Left accent bar ── -->
  <rect x="80" y="90" width="2" height="450" fill="#B8965A" opacity="0.4"/>

  <!-- ── Corner ornament marks ── -->
  <!-- Top-left -->
  <g stroke="#B8965A" stroke-width="1" fill="none" opacity="0.35">
    <line x1="80" y1="110" x2="120" y2="110"/>
    <line x1="80" y1="90" x2="80" y2="130"/>
  </g>
  <!-- Top-right -->
  <g stroke="#B8965A" stroke-width="1" fill="none" opacity="0.35">
    <line x1="1120" y1="110" x2="1080" y2="110"/>
    <line x1="1120" y1="90" x2="1120" y2="130"/>
  </g>
  <!-- Bottom-left -->
  <g stroke="#B8965A" stroke-width="1" fill="none" opacity="0.35">
    <line x1="80" y1="520" x2="120" y2="520"/>
    <line x1="80" y1="540" x2="80" y2="500"/>
  </g>
  <!-- Bottom-right -->
  <g stroke="#B8965A" stroke-width="1" fill="none" opacity="0.35">
    <line x1="1120" y1="520" x2="1080" y2="520"/>
    <line x1="1120" y1="540" x2="1120" y2="500"/>
  </g>

  <!-- ── Typography ── -->

  <!-- Volume marker (kicker) -->
  <text x="106" y="160"
    font-family="'Cormorant Garamond', 'EB Garamond', Georgia, 'Times New Roman', serif"
    font-size="13"
    letter-spacing="4"
    fill="#B8965A"
    opacity="0.85"
    text-anchor="start"
    font-weight="500">VOL. I · EST. 2026</text>

  <!-- Main wordmark -->
  <text x="106" y="285"
    font-family="'Cormorant Garamond', 'EB Garamond', Georgia, 'Times New Roman', serif"
    font-size="96"
    fill="#F0EAE0"
    font-weight="600"
    letter-spacing="-1"
    text-anchor="start">Tracking</text>

  <text x="106" y="390"
    font-family="'Cormorant Garamond', 'EB Garamond', Georgia, 'Times New Roman', serif"
    font-size="96"
    fill="#B8965A"
    font-weight="400"
    font-style="italic"
    letter-spacing="-1"
    text-anchor="start">Faith</text>

  <!-- Tagline -->
  <text x="106" y="462"
    font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="17"
    fill="#F0EAE0"
    opacity="0.5"
    letter-spacing="1.5"
    text-anchor="start">SAME STORY · TOLD DIFFERENTLY</text>

  <!-- Vignette overlay -->
  <rect width="1200" height="630" fill="url(#vignette)" clip-path="url(#bounds)"/>
</svg>
