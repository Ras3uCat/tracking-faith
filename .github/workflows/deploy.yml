name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Write client.json
        run: echo '${{ secrets.CLIENT_JSON }}' > execution/frontend/app/client.json

      - name: Install dependencies
        working-directory: execution/frontend/app
        run: flutter pub get

      - name: Build web
        working-directory: execution/frontend/app
        run: flutter build web --dart-define-from-file="client.json" --release

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: execution/frontend/app/build/web
          cname: trackingfaith.com
